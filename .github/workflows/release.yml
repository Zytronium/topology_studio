name: Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag name"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag for the release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name || github.event.inputs.tag_name }}
  APP_NAME: "Topology Studio"

jobs:
  # ==================== LINUX PACKAGES ====================

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libasound2-dev

      - name: Build release
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: target/release/topology_studio

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/topology_studio

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage@v1
        with:
          recipe: AppImageBuilder.yml

      - name: Upload AppImage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: Topology Studio-x86_64.AppImage
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb-rpm:
    name: Build DEB and RPM
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: target/release

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          gem install --user-install --no-document fpm
          echo "$HOME/.local/share/gem/ruby/3.3.0/bin" >> "$GITHUB_PATH"

      - name: Create package directory
        run: |
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/icons/hicolor/512x512/apps
          mkdir -p package/usr/share/applications
          cp target/release/topology_studio package/usr/bin/
          cp assets/icon.svg package/usr/share/icons/hicolor/512x512/apps/topology_studio.svg
          cat > package/usr/share/applications/topology_studio.desktop << 'EOF'
          [Desktop Entry]
          Name=Topology Studio
          Comment=Network Topology Studio
          Exec=topology_studio
          Icon=topology_studio
          Terminal=false
          Type=Application
          Categories=Development;
          EOF

      - name: Build DEB package
        run: |
          fpm -s dir -t deb \
            -n topology_studio \
            --version ${RELEASE_TAG#v} \
            --vendor "Zytronium" \
            --url "https://github.com/Zytronium/topology_studio" \
            --description "Network Topology Studio" \
            --category Development \
            --license MIT \
            --icon assets/icon.svg \
            -C package \
            .

      - name: Build RPM package
        run: |
          fpm -s dir -t rpm \
            -n topology_studio \
            --version ${RELEASE_TAG#v} \
            --vendor "Zytronium" \
            --url "https://github.com/Zytronium/topology_studio" \
            --description "Network Topology Studio" \
            --category Development \
            --license MIT \
            --icon assets/icon.svg \
            -C package \
            .

      - name: Upload DEB package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: topology_studio_${RELEASE_TAG#v}_amd64.deb
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload RPM package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: topology_studio-${RELEASE_TAG#v}-1.x86_64.rpm
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: build-linux
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/topology_studio

      - name: Create Flatpak manifest
        run: |
          cat > com.topology_studio.app.yml << 'EOF'
          {
            "app-id": "com.topology_studio.app",
            "runtime": "org.gnome.Runtime",
            "runtime-version": "50",
            "sdk": "org.gnome.Sdk",
            "command": "topology_studio",
            "finish-args": [
              "--share=ipc",
              "--share=network",
              "--socket=fallback-x11",
              "--socket=wayland",
              "--device=dri"
            ],
            "modules": [
              {
                "name": "topology_studio",
                "buildsystem": "simple",
                "build-commands": [
                  "install -Dm755 topology_studio /app/bin/topology_studio",
                  "install -Dm644 icon.svg /app/share/icons/hicolor/512x512/apps/topology_studio.svg",
                  "install -Dm644 topology_studio.desktop /app/share/applications/topology_studio.desktop"
                ],
                "sources": [
                  {
                    "type": "file",
                    "path": "target/release/topology_studio"
                  },
                  {
                    "type": "file",
                    "path": "assets/icon.svg"
                  },
                  {
                    "type": "inline",
                    "contents": "[Desktop Entry]\nName=Topology Studio\nComment=Network Topology Studio\nExec=topology_studio\nIcon=topology_studio\nTerminal=false\nType=Application\nCategories=Development;\n",
                    "dest-filename": "topology_studio.desktop"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: com.topology_studio.app.yml
          bundle: "Topology Studio-${{ github.event.release.tag_name || inputs.tag_name || github.event.inputs.tag_name }}.flatpak"
          cache-key: build-flatpak-gnome50

      - name: Upload Flatpak
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: "Topology Studio-${{ github.event.release.tag_name || inputs.tag_name || github.event.inputs.tag_name }}.flatpak"
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== WINDOWS PACKAGES ====================

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: target/release/topology_studio.exe

  build-windows-exe:
    name: Build Windows EXE Installer
    runs-on: windows-latest
    needs: build-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: target/release

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        with:
          path: installer/setup.iss
          options: /DVersion=${{ github.event.release.tag_name || inputs.tag_name || github.event.inputs.tag_name }}

      - name: Upload EXE installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: output/TopologyStudio-*-setup.exe
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-msi:
    name: Build Windows MSI Installer
    runs-on: windows-latest
    needs: build-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: target/release

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Create WiX project
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart('v')
          New-Item -ItemType Directory -Path wix -Force
          $xml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Name="Topology Studio" Language="1033" Version="$version.0" Manufacturer="Zytronium" UpgradeCode="A1B2C3D4-E5F6-7890-ABCD-EF1234567890">
            <Package Id="*" Keywords="Installer" Description="Topology Studio Installer" Comments="" Manufacturer="Zytronium" InstallerVersion="200" Languages="1033" Compressed="yes" SummaryCodepage="1252">
              <MajorUpgrade Schedule="afterInstallInitialize" DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate />
              <Feature Id="ProductFeature" Title="Topology Studio" Level="1">
                <ComponentRef Id="ApplicationComponent" />
                <ComponentRef Id="ShortcutComponent" />
              </Feature>
              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLDIR" Name="Topology Studio">
                  <Component Id="ApplicationComponent" Guid="{B2C3D4E5-F678-90AB-CDEF-1234567890AB}">
                    <File Source="target\release\topology_studio.exe" KeyPath="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>
              <StandardDirectory Id="ProgramMenuFolder">
                <Component Id="ShortcutComponent" Guid="{C3D4E5F6-7890-ABCD-EF12-34567890ABCD}">
                  <Shortcut Id="ApplicationShortcut" Name="Topology Studio" Target="[INSTALLDIR]topology_studio.exe" WorkingDirectory="INSTALLDIR" />
                  <RemoveFolder Id="CleanupProgramMenu" Directory="ProgramMenuFolder" On="uninstall" />
                  <RegistryValue Root="HKCU" Key="Software\Zytronium\Topology Studio" Name="installed" Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </StandardDirectory>
            </Package>
            </Product>
          </Wix>
          "@
          $xml | Out-File -FilePath wix\Product.wxs -Encoding utf8

      - name: Build MSI
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart('v')
          candle wix\Product.wxs -out wix\Product.wixobj
          light wix\Product.wixobj -out "TopologyStudio-$version.msi"

      - name: Upload MSI installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: TopologyStudio-*.msi
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== MACOS PACKAGES ====================

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install SVG converter
        run: brew install librsvg

      - name: Convert SVG icon to ICNS
        run: |
          rsvg-convert -w 1024 -h 1024 assets/icon.svg > assets/icon_1024.png
          mkdir -p icon.iconset
          sips -z 16 16 assets/icon_1024.png --out icon.iconset/icon_16x16.png
          sips -z 32 32 assets/icon_1024.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/icon_1024.png --out icon.iconset/icon_32x32.png
          sips -z 64 64 assets/icon_1024.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icon_1024.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 assets/icon_1024.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icon_1024.png --out icon.iconset/icon_256x256.png
          sips -z 512 512 assets/icon_1024.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/icon_1024.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon_1024.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o assets/icon.icns
          rm -rf icon.iconset assets/icon_1024.png

      - name: Build release (aarch64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/topology_studio \
            target/aarch64-apple-darwin/release/topology_studio \
            target/x86_64-apple-darwin/release/topology_studio

      - name: Create .app bundle
        run: |
          APP_NAME="Topology Studio.app"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"
          cp target/topology_studio "$APP_NAME/Contents/MacOS/"
          cp assets/icon.icns "$APP_NAME/Contents/Resources/"
          VERSION="${RELEASE_TAG#v}"
          cat > "$APP_NAME/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Topology Studio</string>
              <key>CFBundleExecutable</key>
              <string>topology_studio</string>
              <key>CFBundleIconFile</key>
              <string>icon</string>
              <key>CFBundleIdentifier</key>
              <string>com.topology-studio.app</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        id: create-dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Topology Studio" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "Topology Studio.app" 160 185 \
            --app-drop-link 500 185 \
            "Topology Studio.dmg" \
            "Topology Studio.app"
          echo "dmg_path=Topology Studio.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.create-dmg.outputs.dmg_path }}
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
