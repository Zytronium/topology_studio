name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag for the release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libasound2-dev inkscape

      - name: Convert SVG icon to PNG
        run: |
          inkscape assets/icon.svg --export-type=png --export-filename=assets/topology_studio.png

      - name: Build release
        run: cargo build --release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            target/release/topology_studio
            assets/topology_studio.desktop
            assets/topology_studio.png
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Inkscape and ImageMagick
        run: |
          choco install inkscape -y
          choco install imagemagick -y

      - name: Convert SVG icon to ICO
        run: |
          inkscape assets/icon.svg --export-type=png --export-filename=assets/icon_temp.png
          magick convert assets/icon_temp.png -define icon:auto-resize assets/icon.ico
          Remove-Item assets/icon_temp.png

      - name: Build release
        run: cargo build --release

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: target/release/topology_studio.exe
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: universal-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Inkscape
        run: brew install --cask inkscape

      - name: Convert SVG icon to ICNS
        run: |
          inkscape assets/icon.svg --export-type=png --export-filename=assets/icon_1024.png
          mkdir -p icon.iconset
          sips -z 16 16 assets/icon_1024.png --out icon.iconset/icon_16x16.png
          sips -z 32 32 assets/icon_1024.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/icon_1024.png --out icon.iconset/icon_32x32.png
          sips -z 64 64 assets/icon_1024.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icon_1024.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 assets/icon_1024.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icon_1024.png --out icon.iconset/icon_256x256.png
          sips -z 512 512 assets/icon_1024.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/icon_1024.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon_1024.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o assets/icon.icns
          rm -rf icon.iconset assets/icon_1024.png

      - name: Build release (universal)
        run: cargo build --release --target universal-apple-darwin

      - name: Create .app bundle
        run: |
          APP_NAME="Network Topology Studio.app"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"
          cp target/universal-apple-darwin/release/topology_studio "$APP_NAME/Contents/MacOS/"
          cp assets/icon.icns "$APP_NAME/Contents/Resources/"
          cat > "$APP_NAME/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Network Topology Studio</string>
              <key>CFBundleExecutable</key>
              <string>topology_studio</string>
              <key>CFBundleIconFile</key>
              <string>icon</string>
              <key>CFBundleIdentifier</key>
              <string>com.topology-studio.app</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
          </dict>
          </plist>
          EOF
          zip -r "Network Topology Studio.app.zip" "$APP_NAME"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: "Network Topology Studio.app.zip"
          name: "Topology Studio ${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
