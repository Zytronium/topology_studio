version: 1

script:
  - rm -rf AppDir || true
  - mkdir -p AppDir/usr/bin
  - cp target/release/topology_studio AppDir/usr/bin/topology_studio
  - mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
  - cp assets/icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/topology_studio.svg
  - mkdir -p AppDir/usr/share/applications
  - |
    cat > AppDir/usr/share/applications/com.topology_studio.app.desktop << 'DESKTOP'
    [Desktop Entry]
    Type=Application
    Name=Topology Studio
    Comment=Network Topology Studio
    Exec=topology_studio
    Icon=topology_studio
    Terminal=false
    Categories=Development;
    DESKTOP

AppDir:
  path: ./AppDir
  app_info:
    id: com.topology_studio.app
    name: Topology Studio
    icon: topology_studio
    version: "{{RELEASE_TAG}}"
    exec: usr/bin/topology_studio
    exec_args: $@
  apt:
    arch: amd64
    allow_unauthenticated: true
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
    include:
      - libgtk-3-0
      - libasound2
      - libx11-6
      - libxi6
      - libxrandr2
      - libxcursor1
      - libgl1
  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*

AppImage:
  arch: x86_64
  update-information: gh-releases-zsync|Zytronium|topology_studio|latest|*x86_64.AppImage.zsync
