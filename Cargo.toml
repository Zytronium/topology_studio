[package]
name = "topology_studio"
version = "1.0.1"
edition = "2024"

[dependencies]
eframe = "0.33"
egui = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rfd = "0.14"
resvg = "0.45"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winresource = "0.1"
